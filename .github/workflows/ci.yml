name: CI

on: [push, pull_request]

jobs:
  build:
    name: Lint & Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.1", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json

      - name: Syntax check
        run: find src -name "*.php" -exec php -l {} \;

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install autoloader
        run: composer install --no-interaction

      - name: Smoke test
        run: |
          php -r '
            require "vendor/autoload.php";
            $mail = new \ZeroDrop\Client();
            $inbox = $mail->generateInbox();
            if (!preg_match("/^[a-z]+-[a-z0-9]{7}@zerodrop-sandbox\.online$/", $inbox)) {
              throw new \Exception("bad inbox: " . $inbox);
            }
            $f = new \ZeroDrop\Filter(hasOtp: true);
            $email = \ZeroDrop\Email::fromArray(["otp" => "123456", "from" => "a@b.c"]);
            if (!$f->matches($email)) {
              throw new \Exception("filter broken");
            }
            echo "smoke test passed: " . $inbox . PHP_EOL;
          '
